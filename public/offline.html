<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
    <title>Sin conexión</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: #f3f4f6;
            color: #1c2430;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            text-align: center;
        }
        img {
            width: 84px;
            height: 84px;
            border-radius: 20px;
        }
        h1 {
            margin: 20px 0 8px;
            font-size: 22px;
            letter-spacing: -0.03em;
        }
        p {
            margin: 0;
            color: #5c6775;
            font-size: 15px;
            line-height: 1.45;
        }
        button {
            margin-top: 22px;
            border: 0;
            border-radius: 999px;
            background: #1b3a57;
            color: #fff;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 22px;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background: #14171c; color: #e7eaee; }
            p { color: #a1a1aa; }
            button { background: #f4f4f5; color: #18181b; }
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/apple-touch-icon.png" alt="">
        <h1>Sin conexión</h1>
        <p>Libreta necesita red para abrir tu cuaderno.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
